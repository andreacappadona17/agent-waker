name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # These jobs run the same pnpm scripts a developer runs locally, which run the
  # same digest-pinned containers. There is one definition of each tool and its
  # version, in scripts/tool.sh, so local and CI cannot drift apart.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the tip commit. A shallow clone
          # would silently reduce this to one commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Scan repository history for secrets
        run: pnpm run scan:secrets

  audit:
    name: Dependency audit (whole tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Audit dependencies
        run: pnpm run scan:deps

  sbom:
    name: Software bill of materials
    # Only for what ships. A CycloneDX document for a throwaway pull-request
    # branch has no consumer.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Generate CycloneDX SBOM
        run: pnpm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
