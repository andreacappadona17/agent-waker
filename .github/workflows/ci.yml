name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 is the supported baseline (package.json engines), 26 is current.
        # macOS is a first-class target: the launchd scheduler only runs there.
        os: [ubuntu-latest, macos-latest]
        node: ["24", "26"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      # One command rather than a copy of its steps, so CI and `pnpm verify`
      # cannot drift. pnpm names each sub-script in the log as it runs.
      - name: Verify
        run: pnpm run verify

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Lint GitHub Actions workflows
        run: pnpm run lint:workflows

  code-quality:
    name: Code quality (SonarQube)
    # Opt-in: set SONAR_ENABLED=true and add SONAR_TOKEN. Variables resolve in
    # the base repository, so fork pull requests need excluding explicitly.
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      github.event.pull_request.head.repo.fork != true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to attribute issues to the right commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      # Cheaper than an artifact round-trip between jobs.
      - name: Generate coverage
        run: pnpm run test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          # Pinned here so a branch cannot redirect the token via
          # sonar-project.properties.
          args: -Dsonar.host.url=${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
